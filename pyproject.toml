[build-system]
requires = ["scikit-build-core>=0.5.0", "nanobind>=1.9.0"]
build-backend = "scikit_build_core.build"

[project]
name = "stalker-math"
version = "0.1.0"
description = "Python bindings for the Stalker HPC math library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.scikit-build]
cmake.minimum-version = "3.18"
ninja.make-fallback = false
build-dir = "build/python"
wheel.packages = ["bindings/python/stalker"]
cmake.args = ["-DSTALKER_BUILD_PYTHON=ON"]
cmake.build-type = "Release"
build.tool-args = ["-j0"]
